[package]
name = "minio-mz"
version = "1.3.0"
description = "MinLZ command-line tool (Rust port)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mz"
path = "src/main.rs"

[dependencies]
minlz = { package = "minio-minlz", version = "1.3.0", path = "../../crates/minlz" }

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
