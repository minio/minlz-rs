[package]
name = "minio-mz"
version = "1.3.0"
description = "mz, the MinLZ command-line tool: compresses, decompresses, checks and benchmarks MinLZ files"
readme = "../../README.md"
keywords = ["minlz", "compression", "cli", "decompression"]
categories = ["command-line-utilities", "compression"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mz"
path = "src/main.rs"

[dependencies]
# Exact, since unstable-internals is not covered by semver; bump it with minio-minlz.
minlz = { package = "minio-minlz", version = "=1.3.0", path = "../../crates/minlz", features = ["unstable-internals"] }
same-file = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
