[package]
name = "minio-minlz"
version = "1.3.0"
description = "MinLZ compression"
edition.workspace = true
rust-version.workspace = true
# The AVX-512 histogram is MIT licensed: src/pivco/kernel/LICENSE-histogram.
license = "Apache-2.0 AND MIT"
repository.workspace = true
authors.workspace = true

[lib]
name = "minlz"
path = "src/lib.rs"

[features]
# The clean-room reference decoder `minlz::reference`, an oracle for tests and fuzzing.
reference = []

[[example]]
name = "bench"
path = "examples/bench.rs"

[[bench]]
name = "block"
harness = false

[[bench]]
name = "stream"
harness = false

[[bench]]
name = "pivco"
harness = false

[[bench]]
name = "xxh3"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["html_reports"] }
ureq = "3.3.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(minlz_readme)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
