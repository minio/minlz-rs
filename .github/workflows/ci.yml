name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # ---- Fast feedback: fmt + clippy on a single host ------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---- Cross-platform build + test matrix ---------------------------------
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
        rust: [stable, "1.89"]   # 1.89 = workspace MSRV (rust-version in Cargo.toml)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: cargo build
        run: cargo build --workspace --all-targets --verbose
      - name: cargo test (debug, lib)
        run: cargo test --workspace --lib --verbose
      - name: cargo test (debug, integration + CLI)
        # Covers integration tests under `crates/minlz/tests/` and CLI
        # tests under `bin/mz/tests/`.  Cross-impl tests gated on
        # `MINLZ_GO_CMD` self-skip cleanly when it's unset. The `reference`
        # feature runs the SIMD fixtures through the reference decoder.
        run: cargo test --workspace --tests --features minlz/reference --verbose
      - name: cargo test (debug, doctests)
        # `--doc` cannot be combined with other target flags, so run
        # in its own step.
        run: cargo test --workspace --doc --verbose
      - name: cargo test (release, lib)
        run: cargo test --workspace --lib --release --verbose

  # ---- Docs ---------------------------------------------------------------
  docs:
    name: rustdoc
    needs: lint
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
